name: Refresh BOT and Grand SuperRich cash rates

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are UTC and can be delayed.
    # 08:17-20:17 Thailand / 09:17-21:17 Taiwan, every day.
    - cron: "17 1-13 * * *"
  push:
    paths:
      - ".github/workflows/update-rates.yml"
      - "scripts/update_rates.py"
      - "index.html"
      - "tests/browser_smoke.cjs"

permissions:
  contents: write

concurrency:
  group: official-cash-rates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - name: Test quote parsing using offline fixtures
        run: python scripts/update_rates.py --self-test
      - name: Check inline JavaScript syntax and required source-status elements
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from bs4 import BeautifulSoup
          page = Path("index.html").read_text(encoding="utf-8")
          ids = {element.get("id") for element in BeautifulSoup(page, "html.parser").select("[id]")}
          required = {"officialCards", "referenceCards", "mirrorContent", "referenceToggle",
                      "officialToggle", "manualToggle", "rateBody", "bars",
                      "reloadRates", "historyCurrency", "historyPeriods"}
          assert required <= ids, "Missing required controls: " + str(required - ids)
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", page, re.S | re.I)
          assert len(scripts) == 2, "Expected main UI and history chart scripts"
          for i, script in enumerate(scripts):
              target = Path("/tmp/thai-exchange-script-" + str(i) + ".js")
              target.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(target)], check=True)
          print("Frontend JavaScript syntax and required UI elements verified.")
          PY
      - name: Install simulated browser test runtime
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Browser functional smoke tests (official / reference / manual / trend)
        run: node tests/browser_smoke.cjs
      - name: Check official and third-party reference sources independently
        run: python scripts/update_rates.py
      - name: Publish attributed source status and values only when changed
        run: |
          if [[ -n "$(git status --porcelain -- rates.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rates.json
            git commit -m "Check official cash quotes and separate third-party reference statuses"
            git fetch origin main
            git rebase origin/main
            git push
          else
            echo "No new official quotations, nothing to commit."
          fi
